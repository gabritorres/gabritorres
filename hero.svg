<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
<title id="title">Gabriel Torres — software engineering</title><desc id="desc">Dark editorial banner with an animated network of connected points.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b1020"/><stop offset=".55" stop-color="#101b36"/><stop offset="1" stop-color="#122a47"/></linearGradient><linearGradient id="line"><stop stop-color="#55d6d0"/><stop offset="1" stop-color="#8a8dff"/></linearGradient><radialGradient id="glow"><stop stop-color="#43d5d0" stop-opacity=".22"/><stop offset="1" stop-color="#43d5d0" stop-opacity="0"/></radialGradient><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#8ba7d0" stroke-opacity=".07"/></pattern>
<style>.wire{fill:none;stroke:url(#line);stroke-width:1;opacity:.35}.orb{fill:#82e5dd}.pulse{animation:pulse 3.6s ease-in-out infinite}.pulse2{animation:pulse 4.5s ease-in-out infinite 1s}.orbit{transform-origin:948px 210px;animation:spin 32s linear infinite}.signal{stroke-dasharray:5 8;animation:flow 12s linear infinite}@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes flow{to{stroke-dashoffset:-130}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style></defs>
<rect width="1200" height="420" rx="20" fill="url(#bg)"/><rect width="1200" height="420" rx="20" fill="url(#grid)"/><circle cx="950" cy="200" r="230" fill="url(#glow)"/><rect x="34" y="30" width="1132" height="360" rx="10" fill="none" stroke="#8fa8d0" stroke-opacity=".18"/>
<text x="68" y="77" fill="#6ee7d9" font-family="Consolas,monospace" font-size="15" letter-spacing="3">GABRITORRES / DEVELOPER PROFILE</text><text x="68" y="169" fill="#f3f7ff" font-family="Arial,sans-serif" font-weight="700" font-size="60" letter-spacing="-2">Gabriel Torres</text><text x="70" y="210" fill="#a7b9d6" font-family="Consolas,monospace" font-size="20">FULL-STACK DEVELOPMENT  +  AI</text><path d="M70 244h88" stroke="#69e0d5" stroke-width="3"/><text x="70" y="292" fill="#dce6f7" font-family="Arial,sans-serif" font-size="21">Ideas, interfaces and systems.</text><text x="70" y="326" fill="#9aacc9" font-family="Arial,sans-serif" font-size="18">Building thoughtful software from Spain.</text><text x="70" y="366" fill="#6e86a9" font-family="Consolas,monospace" font-size="12" letter-spacing="2">DESIGN  /  ENGINEERING  /  EXPLORATION</text>
