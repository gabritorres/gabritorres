<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc"><title id="title">From idea to product</title><desc id="desc">An animated diagram linking product ideas, interfaces, systems and intelligence.</desc><defs><linearGradient id="b" x2="1" y2="1"><stop stop-color="#0b1020"/><stop offset="1" stop-color="#16283f"/></linearGradient><linearGradient id="l"><stop stop-color="#68e0d6"/><stop offset="1" stop-color="#9b9eff"/></linearGradient><style>.line{fill:none;stroke:#6584a9;stroke-opacity:.35;stroke-width:2}.signal{fill:none;stroke:url(#l);stroke-width:3;stroke-dasharray:5 420;stroke-linecap:round;animation:travel 4.5s linear infinite}@keyframes travel{to{stroke-dashoffset:-425}}.pulse{animation:pulse 3s ease-in-out infinite}@keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style></defs><rect width="1200" height="300" rx="18" fill="url(#b)"/><rect x="1" y="1" width="1198" height="298" rx="18" fill="none" stroke="#718bb1" stroke-opacity=".25"/><text x="48" y="47" fill="#74dfd4" font-family="Consolas,monospace" font-size="14" letter-spacing="3">THE WAY I BUILD</text><text x="48" y="83" fill="#f2f6ff" font-family="Arial,sans-serif" font-size="25" font-weight="bold">From idea to experience</text><text x="1150" y="47" text-anchor="end" fill="#788fab" font-family="Consolas,monospace" font-size="12" letter-spacing="2">PRODUCT / ENGINEERING / AI</text><path class="line" d="M156 165H1044"/><path class="signal" d="M156 165H1044"/><g font-family="Arial,sans-serif" text-anchor="middle"><g transform="translate(156 165)"><circle r="35" fill="#132a40" stroke="#64dbd2"/><circle class="pulse" r="42" fill="none" stroke="#64dbd2" stroke-opacity=".3"/><text y="7" fill="#82ece0" font-family="Consolas,monospace" font-size="19">01</text><text y="70" fill="#f0f6ff" font-size="16" font-weight="bold">IDEA</text><text y="93" fill="#9dafc9" font-size="13">